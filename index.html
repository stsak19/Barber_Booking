function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = window.atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

const bufToBase64Url = (buf) =>

function bufToBase64(buf) {

  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);

}

async function subscribePush(clientId) {

      p_endpoint: sub.endpoint,

  writeKnown(readKnown().filter((b) => b.id !== id));
}
/* Συγκρίνει τη λίστα του διακομιστή με ό,τι ξέραμε. Μια κράτηση
   μετράει ως ακυρωμένη είτε αν γύρισε με status "cancelled", είτε
   αν εξαφανίστηκε ενώ η ώρα της δεν έχει περάσει ακόμα. */
function findCancelled(bookings) {
  const list = bookings || [];
  const active = list.filter((b) => b.status !== "cancelled");
  const live = new Set(active.map((b) => b.id));
  const explicit = new Set(list.filter((b) => b.status === "cancelled").map((b) => b.id));
  const now = new Date();
  const gone = readKnown().filter((b) =>
    !live.has(b.id) && (explicit.has(b.id) || slotDate(b.date, b.time) > now));
  writeKnown(active.map((b) => ({ id: b.id, date: b.date, time: b.time })));
  return gone;
}

/* Κάθε σημείο της εφαρμογής που φέρνει κρατήσεις περνάει από εδώ.
   Έτσι μια νέα κράτηση καταγράφεται αμέσως μόλις γίνει, και δεν
   χάνεται η ακύρωση αν ο διαχειριστής προλάβει πριν τον επόμενο
   αυτόματο έλεγχο. */
const ALERTED = new Set();
const PENDING = [];
let cancelListener = null;

function reportBookings(bookings) {
  const gone = findCancelled(bookings).filter((b) => !ALERTED.has(b.id));
  if (gone.length === 0) return;
  gone.forEach((b) => ALERTED.add(b.id));
  if (cancelListener) cancelListener(gone);
  else PENDING.push(...gone);
  /* Την ειδοποίηση συστήματος τη στέλνει ο διακομιστής με push. Από
     εδώ τη βγάζουμε μόνο σε συσκευές που δεν είναι γραμμένες —
     υπολογιστής, ή πελάτης που δεν έδωσε άδεια. Αλλιώς θα ερχόταν
     δεύτερη φορά μόλις ανοίξει την εφαρμογή. */
  hasPushSubscription().then((pushOn) => {
    if (pushOn) return;
    for (const g of gone) {
      localNotify("⚠️ Το ραντεβού σου ακυρώθηκε !⚠️",
        `${fmtDayLong(g.date)}, ${g.time}`, "barber-cancel-" + g.id);
    }
  });
}

/* Είναι αυτή η συσκευή γραμμένη στις push ειδοποιήσεις; */
async function hasPushSubscription() {
  try {
    if (!pushSupported()) return false;
    const reg = await navigator.serviceWorker.ready;
    return !!(await reg.pushManager.getSubscription());
  } catch (e) { return false; }
}

/* ---------- Ακυρώσεις από τον πίνακα του διακομιστή ----------
   Ο έλεγχος από πάνω συγκρίνει με ό,τι θυμόταν η συσκευή, οπότε
   χάνει την ακύρωση αν η εφαρμογή δεν είχε προλάβει να δει ποτέ την
   κράτηση — για παράδειγμα μετά από νέα σύνδεση ή καθάρισμα του
   browser. Οι ειδοποιήσεις του διακομιστή δεν έχουν αυτό το κενό. */
const ALERTED_KEY = "barber_alerted_notifs";

function readAlerted() {
  try { return JSON.parse(localStorage.getItem(ALERTED_KEY) || "[]"); } catch (e) { return []; }
}
function writeAlerted(list) {
  try { localStorage.setItem(ALERTED_KEY, JSON.stringify(list.slice(-100))); } catch (e) { /* ignore */ }
}
function resetAlerted() {
  try { localStorage.removeItem(ALERTED_KEY); } catch (e) { /* ignore */ }
}

function reportNotifications(list) {
  const items = (list || []).filter((n) => n && n.kind === "cancelled");
  let raw = null;
  try { raw = localStorage.getItem(ALERTED_KEY); } catch (e) { /* ignore */ }

  /* Πρώτη φορά σε αυτή τη συσκευή: καταγράφουμε ό,τι υπάρχει ήδη
     χωρίς να χτυπήσουμε, αλλιώς θα έσκαγαν μαζεμένες όλες οι παλιές. */
  if (raw === null) { writeAlerted(items.map((n) => n.id)); return; }

  const seen = readAlerted();
  const fresh = items.filter((n) => !seen.includes(n.id));
  if (fresh.length === 0) return;
  writeAlerted([...seen, ...fresh.map((n) => n.id)]);

  /* Ίδιος κανόνας: αν η συσκευή παίρνει push, την έχει ήδη λάβει. */
  hasPushSubscription().then((pushOn) => {
    if (pushOn) return;
    for (const n of fresh) {
      localNotify("⚠️ Το ραντεβού σου ακυρώθηκε !⚠️", n.body || "", "barber-cancel-" + n.id);
    }
  });
}

/* Ειδοποίηση συστήματος, αν ο πελάτης έχει δώσει άδεια. */
async function localNotify(title, body, tag) {
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(title, {
      body: body,
      icon: "./icon-192.png",
      badge: "./icon-192.png",
      tag: tag || "barber-cancel",
    });
  } catch (e) { /* ignore */ }
}

function Button({ children, onClick, variant = "primary", disabled, className = "", size = "md" }) {

  const variants = {
    primary: "bg-black text-white",
    outline: "border border-neutral-300 text-black",
    ghost: "text-neutral-500 font-medium",
    /* Κόκκινο για ό,τι δεν γυρίζει πίσω. Το χρώμα μπαίνει από την

function App() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  const [toast, setToast] = useState("");
  const [theme, setTheme] = useState(readTheme);
  const [justSignedUp, setJustSignedUp] = useState(false);
  const [gone, setGone] = useState(false);
  const flash = useCallback((m) => { setToast(m); setTimeout(() => setToast(""), 2800); }, []);

  useEffect(() => {
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore */ }
    if (theme !== "auto") return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => applyTheme("auto");
    mq.addEventListener("change", onChange);
    return () => mq.removeEventListener("change", onChange);
  }, [theme]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) setSession(JSON.parse(raw));
    } catch (e) { /* ignore */ }
    setReady(true);
  }, []);

  /* Οι θυμημένες κρατήσεις ανήκουν σε έναν λογαριασμό. Σε αλλαγή
     λογαριασμού καθαρίζουν, αλλιώς ο επόμενος πελάτης θα έβλεπε
     ακυρώσεις που δεν είναι δικές του. */
  const login = (s, justSignedUp) => {
    writeKnown([]); ALERTED.clear(); resetAlerted();
    setJustSignedUp(!!justSignedUp);
    setSession(s);
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
  };
  const logout = () => {
    writeKnown([]); ALERTED.clear(); resetAlerted();
    setJustSignedUp(false);
    setSession(null);
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
  };

  /* Ο λογαριασμός δεν υπάρχει πια στη βάση — τον έσβησε η διαχείριση.
     Βγαίνει έξω, καθαρίζουν όλα τα ίχνη του από τη συσκευή, και για να
     ξαναμπεί πρέπει να κάνει καινούρια εγγραφή. */
  const accountGone = useCallback((reason) => {
    unsubscribePush();
    writeKnown([]); ALERTED.clear(); resetAlerted(); writeHidden([]);
    try {
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(PUSH_ASKED_KEY);
    } catch (e) { /* ignore */ }
    setJustSignedUp(false);
    setSession(null);
    /* Αν προλάβει να απαντήσει ο έλεγχος στο παρασκήνιο αφού έσβησε
       ο ίδιος τον λογαριασμό του, να μη γυρίσει το μήνυμα σε «σε
       διέγραψε το κατάστημα». */
    setGone((prev) => (prev === "self" || reason === "self" ? "self" : "admin"));
  }, []);

  if (!ready) {
    return <div style={FONT} className="app-root flex h-full items-center justify-center text-[15px] text-neutral-400">Φόρτωση…</div>;
  }

  return (
    <div className="app-root h-full overflow-hidden text-black"
      style={ { ...FONT, background: "var(--paper)" } }>
      {gone
        ? <AccountGone reason={gone} onDone={() => setGone(false)} />
        : !session
          ? <SignIn onLogin={login} flash={flash} />
          : <ClientApp session={session} onLogout={logout} onAccountGone={accountGone}
              justSignedUp={justSignedUp} clearSignedUp={() => setJustSignedUp(false)}
              flash={flash} theme={theme} setTheme={setTheme} />}
      <Toast msg={toast} />
    </div>
  );
}

/* ============================================================
   Ο λογαριασμός δεν υπάρχει πια — είτε τον έσβησε η διαχείριση,

   ============================================================ */

          : "Το κατάστημα διέγραψε τον λογαριασμό σου. Τα ραντεβού και το ιστορικό σου έχουν σβηστεί. Αν θέλεις να ξαναχρησιμοποιήσεις την εφαρμογή, κάνε καινούρια εγγραφή ή μίλα με το κατάστημα."}

/* ============================================================
   Ποπ απ ειδοποιήσεων — βγαίνει μία φορά, μετά την εγγραφή
   ============================================================ */
function PushPrompt({ session, onClose, flash }) {
  const [busy, setBusy] = useState(false);
  const needsInstall = isIOS() && !isStandalone();

  const yes = async () => {
    setBusy(true);
    const r = await subscribePush(session.clientId);
    setBusy(false);
    markPushAsked();
    if (r.ok) flash("Οι ειδοποιήσεις ενεργοποιήθηκαν");
    else if (r.error === "denied") flash("Δεν δόθηκε άδεια — μπορείς να το κάνεις αργότερα");
    else flash("Κάτι πήγε στραβά, δοκίμασε από τις ρυθμίσεις");
    onClose();
  };

  const no = () => { markPushAsked(); onClose(); };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-black/50 px-4 py-6"
      onClick={no}>
      <div className="w-full max-w-sm rounded-3xl bg-white p-5 shadow-xl" onClick={(e) => e.stopPropagation()}>
        <div className="f-display text-[18px] font-semibold">
          Να σε ειδοποιούμε;
        </div>

        {needsInstall ? (
          <>
            <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
              Στο iPhone οι ειδοποιήσεις δουλεύουν μόνο αν προσθέσεις πρώτα την εφαρμογή
              στην αρχική οθόνη:
            </p>
            <ol className="f-text mt-2 space-y-1 text-[13px] leading-relaxed text-neutral-600">
              <li>1. Πάτα το κουμπί κοινοποίησης του Safari (τετράγωνο με βέλος).</li>
              <li>2. Διάλεξε «Προσθήκη στην οθόνη Home».</li>
              <li>3. Άνοιξε την εφαρμογή από το νέο εικονίδιο.</li>
            </ol>
            <Button className="mt-5 w-full" onClick={no}>Κατάλαβα</Button>
          </>
        ) : (
          <>
            <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
              Θα σε ειδοποιούμε όταν ελευθερώνεται θέση από τη λίστα αναμονής, όταν
              ακυρώνεται ραντεβού σου, και λίγο πριν το ραντεβού. Μπορείς να το
              κλείσεις όποτε θέλεις από τις ρυθμίσεις.
            </p>
            <Button className="mt-5 w-full" disabled={busy} onClick={yes}>
              {busy ? "…" : "Ναι, ενεργοποίηση"}
            </Button>
            <Button variant="ghost" className="mt-2 w-full" disabled={busy} onClick={no}>
              Όχι τώρα
            </Button>
          </>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   Sign in
   ============================================================ */
function SignIn({ onLogin, flash }) {
  const [mode, setMode] = useState(null);
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [marketing, setMarketing] = useState(false);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [forgot, setForgot] = useState(false);
  const [policy, setPolicy] = useState(false);

  const resetFields = () => {
    setFirstName(""); setLastName(""); setPhone("");
    setEmail(""); setMarketing(false); setPin(""); setErr("");
    setForgot(false);
  };
  const digits = (v, max) => v.replace(/\D/g, "").slice(0, max);

  const signInClient = async () => {
    const cleanPhone = digits(phone, 10);
    if (cleanPhone.length < 10) { setErr("Γράψε το κινητό σου (10 ψηφία)"); return; }
    if (!/^\d{4}$/.test(pin)) { setErr("Ο κωδικός έχει 4 ψηφία"); return; }
    setBusy(true);
    const { data, error } = await sb.rpc("sign_in_client", { p_phone: cleanPhone, p_pin: pin });
    setBusy(false);
    if (error || !data?.ok) { setErr(data?.error || "Κάτι πήγε στραβά, δοκίμασε ξανά"); return; }
    onLogin({ clientId: data.client_id, firstName: data.first_name, lastName: data.last_name });
  };

  const createClient = async () => {
    const fn = firstName.trim(), ln = lastName.trim();
    const cleanPhone = digits(phone, 10);
    const cleanEmail = email.trim();
    if (!fn) { setErr("Γράψε το όνομά σου"); return; }
    if (!ln) { setErr("Γράψε το επώνυμό σου"); return; }
    if (cleanPhone.length < 10) { setErr("Το κινητό θέλει 10 ψηφία"); return; }
    if (cleanEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cleanEmail)) {
      setErr("Το email δεν φαίνεται σωστό"); return;
    }
    if (marketing && !cleanEmail) { setErr("Για ενημερώσεις χρειάζεται email"); return; }
    if (!/^\d{4}$/.test(pin)) { setErr("Ο κωδικός έχει 4 ψηφία"); return; }
    setBusy(true);
    const { data, error } = await sb.rpc("sign_up_client", {
      p_first_name: fn, p_last_name: ln, p_phone: cleanPhone, p_pin: pin,
      p_email: cleanEmail || null, p_marketing: marketing,
    });
    setBusy(false);
    if (error || !data?.ok) { setErr(data?.error || "Κάτι πήγε στραβά, δοκίμασε ξανά"); return; }
    /* Καινούρια συσκευή, καινούριος λογαριασμός: ξαναρωτάμε για
       ειδοποιήσεις ακόμα κι αν είχε ξαναρωτηθεί από άλλον πελάτη. */
    try { localStorage.removeItem(PUSH_ASKED_KEY); } catch (e) { /* ignore */ }
    onLogin({ clientId: data.client_id, firstName: fn, lastName: ln }, true);
  };

  return (
    <div className="mx-auto flex h-full max-w-md flex-col overflow-hidden">
      <Hero tall={!mode} tagline={TAGLINE} />

      <div className="sheet relative z-10 -mt-7 min-h-0 flex-1 overflow-y-auto px-6 pb-10 pt-7">
        <h1 className="f-display text-[25px] font-semibold leading-tight">
          Κράτησε την ώρα σου<br />σε δέκα δευτερόλεπτα
        </h1>
        <div className="mt-7">
        {!mode && (
          <div className="space-y-3">
            <Button size="lg" onClick={() => { resetFields(); setMode("in"); }}>Σύνδεση πελάτη</Button>
            <Button size="lg" variant="outline" onClick={() => { resetFields(); setMode("new"); }}>Νέος πελάτης</Button>
          </div>
        )}

        {mode === "in" && (
          <div>
            <div className="f-text mb-3 text-[13px] text-neutral-500">Κινητό και προσωπικός κωδικός</div>
            <div className="space-y-2">
              <input value={phone} onChange={(e) => { setPhone(digits(e.target.value, 10)); setErr(""); }}
                inputMode="numeric" placeholder="Κινητό (π.χ. 6971234567)"
                className="f-mono h-12 w-full bg-neutral-100 px-4 text-[16px] outline-none" />
              <input value={pin} onChange={(e) => { setPin(digits(e.target.value, 4)); setErr(""); }}
                inputMode="numeric" placeholder="Κωδικός (4 ψηφία)" type="password"
                className="f-mono h-12 w-full bg-neutral-100 px-4 text-[15px] tracking-[0.3em] outline-none" />
            </div>
            <Button className="mt-3 w-full" disabled={busy} onClick={signInClient}>{busy ? "Σύνδεση…" : "Σύνδεση"}</Button>
            {err && <div className="f-text mt-2 text-[13px] text-neutral-500">{err}</div>}

            <button onClick={() => setForgot(!forgot)}
              className="f-text mt-3 text-[13px] text-neutral-500 underline underline-offset-4">
              Ξέχασα τον κωδικό μου
            </button>
            {forgot && (
              <div className="f-text mt-2 rounded-2xl bg-neutral-100 p-3.5 text-[13px] leading-relaxed text-neutral-700">
                Για την ασφάλειά σου ο κωδικός δεν στέλνεται. Πέρνα από τη γραμματεία
                ή τηλεφώνησε στο κατάστημα και θα σου δώσουν καινούριο.
              </div>
            )}

            <Button variant="ghost" className="mt-2" onClick={() => { setMode(null); setErr(""); setForgot(false); }}>Πίσω</Button>
          </div>
        )}

        {mode === "new" && (
          <div>
            <div className="f-text mb-3 text-[13px] text-neutral-500">Δημιουργία λογαριασμού</div>
            <div className="space-y-2">
              <input value={firstName} onChange={(e) => { setFirstName(e.target.value); setErr(""); }}
                placeholder="Όνομα" className="f-text h-12 w-full bg-neutral-100 px-4 text-[16px] outline-none" />
              <input value={lastName} onChange={(e) => { setLastName(e.target.value); setErr(""); }}
                placeholder="Επώνυμο" className="f-text h-12 w-full bg-neutral-100 px-4 text-[16px] outline-none" />
              <input value={phone} onChange={(e) => { setPhone(digits(e.target.value, 10)); setErr(""); }}
                inputMode="numeric" placeholder="Κινητό" className="f-mono h-12 w-full bg-neutral-100 px-4 text-[16px] outline-none" />
              <input value={email} onChange={(e) => { setEmail(e.target.value); setErr(""); }}
                type="email" inputMode="email" autoCapitalize="none" placeholder="Email (προαιρετικό)"
                className="f-text h-12 w-full bg-neutral-100 px-4 text-[16px] outline-none" />
              <input value={pin} onChange={(e) => { setPin(digits(e.target.value, 4)); setErr(""); }}
                inputMode="numeric" placeholder="Κωδικός (4 ψηφία)" type="text"
                className="f-mono h-12 w-full bg-neutral-100 px-4 text-[15px] tracking-[0.3em] outline-none" />
            </div>

            <button onClick={() => { setMarketing(!marketing); setErr(""); }}
              className="mt-3 flex w-full items-start gap-3 rounded-2xl bg-neutral-100 p-3.5 text-left">
              <span className={`mt-[1px] flex h-5 w-5 shrink-0 items-center justify-center rounded-[7px] border border-neutral-300 ${marketing ? "bg-black" : "bg-white"}`}>
                {marketing && <span className="f-display text-[13px] font-bold leading-none text-white">✓</span>}
              </span>
              <span className="f-text text-[13px] leading-snug text-neutral-700">
                Θέλω να λαμβάνω ενημερώσεις στο email για ομαδικά προγράμματα και προσφορές.
              </span>
            </button>
            <p className="f-text mt-4 text-[12px] leading-relaxed text-neutral-500">
              Με τη δημιουργία λογαριασμού δηλώνεις ότι διάβασες πώς χρησιμοποιεί
              το {SHOP_NAME} τα στοιχεία σου.{" "}
              <button onClick={() => setPolicy(true)}
                className="underline underline-offset-4">
                Πολιτική απορρήτου
              </button>
            </p>
            <Button className="mt-3 w-full" disabled={busy} onClick={createClient}>{busy ? "Δημιουργία…" : "Δημιουργία"}</Button>
            {err && <div className="f-text mt-2 text-[13px] text-neutral-500">{err}</div>}
            <Button variant="ghost" className="mt-2" onClick={() => { setMode(null); setErr(""); }}>Πίσω</Button>
          </div>
        )}

        {mode !== "new" && (
          <div className="mt-6 text-center">
            <button onClick={() => setPolicy(true)}
              className="f-text text-[12px] text-neutral-400 underline underline-offset-4">
              Πολιτική απορρήτου
            </button>
          </div>
        )}
        </div>
      </div>

      {policy && <PrivacyPolicy onClose={() => setPolicy(false)} />}
    </div>
  );
}

/* Η γνώμη του πελάτη για την ίδια την εφαρμογή. Πάει σε ξεχωριστό
   πίνακα που δεν τον βλέπει ούτε ο πελάτης ούτε η διαχείριση —
   μόνο η review.html με τον κωδικό του δημιουργού. Κάθε πελάτης
   έχει μία κριτική, που μπορεί να την ξαναγράψει όποτε θέλει. */
function ReviewPanel({ session, flash }) {
  const [likes, setLikes] = useState("");
  const [dislikes, setDislikes] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [sent, setSent] = useState(false);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      const { data, error } = await sb.rpc("my_review", { p_client_id: session.clientId });
      if (!alive) return;
      if (!error && data) {
        setLikes(data.likes || "");
        setDislikes(data.dislikes || "");
        setSent(!!data.updated_at);
      }
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, [session.clientId]);

  const save = async () => {
    setSaving(true);
    const { data, error } = await sb.rpc("submit_review", {
      p_client_id: session.clientId,
      p_likes: likes.trim() || null,
      p_dislikes: dislikes.trim() || null,
    });
    setSaving(false);
    if (error || !data || data.ok !== true) {
      flash((data && data.error) || "Δεν στάλθηκε");
      return;
    }
    setDirty(false);
    setSent(true);
    flash("Ευχαριστούμε για τη γνώμη σου");
  };

  const empty = !likes.trim() && !dislikes.trim();

  return (
    <div className="mt-8 rounded-3xl border border-neutral-200 p-5">
      <div className="f-display text-[14px] font-semibold">Η γνώμη σου για την εφαρμογή</div>
      <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
        Πες μας τι σου αρέσει και τι όχι. Το διαβάζει μόνο ο δημιουργός
        της εφαρμογής, για να τη φτιάξει καλύτερη. Φεύγει ανώνυμα —
        χωρίς το όνομα ή το τηλέφωνό σου.
      </p>

      {!loaded ? (
        <div className="f-text py-6 text-[13px] text-neutral-400">Φόρτωση…</div>
      ) : (
        <>
          <div className="mt-5">
            <div className="f-display text-[11px] font-medium text-neutral-400">
              Τι μου αρέσει
            </div>
            <textarea value={likes} maxLength={1000} rows={3}
              onChange={(e) => { setLikes(e.target.value); setDirty(true); }}
              placeholder="Γράψε εδώ"
              className="f-text mt-2 w-full resize-none rounded-2xl bg-neutral-100 p-3 text-[14px] leading-snug outline-none" />
          </div>

          <div className="mt-5">
            <div className="f-display text-[11px] font-medium text-neutral-400">
              Τι δεν μου αρέσει
            </div>
            <textarea value={dislikes} maxLength={1000} rows={3}
              onChange={(e) => { setDislikes(e.target.value); setDirty(true); }}
              placeholder="Γράψε εδώ"
              className="f-text mt-2 w-full resize-none rounded-2xl bg-neutral-100 p-3 text-[14px] leading-snug outline-none" />
          </div>

          <div className="mt-5">
            <Button size="lg" disabled={saving || empty || (!dirty && sent)} onClick={save}>
              {saving ? "Αποστολή…" : !dirty && sent ? "Στάλθηκε" : sent ? "Ενημέρωση γνώμης" : "Αποστολή"}
            </Button>
          </div>
        </>
      )}
    </div>
  );
}

/* Ό,τι μπορεί να κάνει ο πελάτης μόνος του με τα στοιχεία του:
   να δει την πολιτική, να ανοίξει ή να κλείσει τις ενημερώσεις στο
   email, και να διαγράψει τον λογαριασμό του. Η διαγραφή θέλει τον
   κωδικό του — δεν φτάνει να κρατάει κάποιος το ξεκλείδωτο κινητό. */
function AccountPanel({ session, flash, onDeleted }) {
  const [email, setEmail] = useState("");
  const [marketing, setMarketing] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [saving, setSaving] = useState(false);
  const [policy, setPolicy] = useState(false);
  const [confirming, setConfirming] = useState(false);
  const [pin, setPin] = useState("");
  const [delErr, setDelErr] = useState("");
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      const { data, error } = await sb.rpc("my_account", { p_client_id: session.clientId });
      if (!alive) return;
      if (!error && data && data.ok) {
        setEmail(data.email || "");
        setMarketing(!!data.marketing);
      }
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, [session.clientId]);

  const save = async () => {
    setSaving(true);
    const { data, error } = await sb.rpc("set_marketing", {
      p_client_id: session.clientId,
      p_opt_in: marketing,
      p_email: email.trim() || null,
    });
    setSaving(false);
    if (error || !data || data.ok !== true) {
      flash((data && data.error) || "Δεν αποθηκεύτηκε");
      return;
    }
    setEmail(data.email || "");
    setDirty(false);
    flash(data.marketing ? "Θα λαμβάνεις ενημερώσεις" : "Δεν θα λαμβάνεις άλλες ενημερώσεις");
  };

  const remove = async () => {
    if (!/^\d{4}$/.test(pin)) { setDelErr("Γράψε τον τετραψήφιο κωδικό σου"); return; }
    setDeleting(true);
    const { data, error } = await sb.rpc("delete_my_account", {
      p_client_id: session.clientId,
      p_pin: pin,
    });
    setDeleting(false);
    if (error || !data || data.ok !== true) {
      setDelErr((data && data.error) || "Δεν έγινε η διαγραφή");
      return;
    }
    onDeleted();
  };

  return (
    <div className="mt-8 rounded-3xl border border-neutral-200 p-5">
      <div className="f-display text-[14px] font-semibold">Ο λογαριασμός μου</div>

      {!loaded ? (
        <div className="f-text py-6 text-[13px] text-neutral-400">Φόρτωση…</div>
      ) : (
        <>
          <div className="mt-4">
            <div className="f-display text-[11px] font-medium text-neutral-400">
              Email
            </div>
            <input value={email} type="email" inputMode="email" autoCapitalize="none"
              onChange={(e) => { setEmail(e.target.value); setDirty(true); }}
              placeholder="Δεν έχεις δώσει email"
              className="f-text mt-2 h-12 w-full bg-neutral-100 px-3 text-[14px] outline-none" />
          </div>

          <button onClick={() => { setMarketing(!marketing); setDirty(true); }}
            className="mt-3 flex w-full items-start gap-3 text-left">
            <span className={`mt-[1px] flex h-5 w-5 shrink-0 items-center justify-center rounded-[7px] border border-neutral-300 ${
              marketing ? "bg-black" : "bg-white"}`}>
              {marketing && <span className="f-display text-[13px] font-bold leading-none text-white">✓</span>}
            </span>
            <span className="f-text text-[13px] leading-snug">
              Θέλω ενημερώσεις στο email για ομαδικά προγράμματα και προσφορές.
            </span>
          </button>

          <div className="mt-4">
            <Button size="lg" disabled={saving || !dirty} onClick={save}>
              {saving ? "Αποθήκευση…" : dirty ? "Αποθήκευση" : "Αποθηκευμένο"}
            </Button>
          </div>

          <button onClick={() => setPolicy(true)}
            className="f-text mt-5 text-[13px] text-neutral-500 underline underline-offset-4">
            Πολιτική απορρήτου
          </button>

          <div className="mt-6 border-t border-neutral-200 pt-5">
            {!confirming ? (
              <>
                <button onClick={() => { setConfirming(true); setPin(""); setDelErr(""); }}
                  className="f-text text-[13px] text-[#C0231F] underline underline-offset-4">
                  Διαγραφή του λογαριασμού μου
                </button>
                <p className="f-text mt-2 text-[12px] leading-relaxed text-neutral-400">
                  Σβήνει το όνομα, το κινητό, τις κρατήσεις και το ιστορικό σου.
                </p>
              </>
            ) : (
              <>
                <div className="f-display text-[13px] font-semibold">
                  Σίγουρα;
                </div>
                <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
                  Όλα σβήνουν αμέσως και δεν γυρίζουν πίσω. Οι μελλοντικές σου
                  κρατήσεις ακυρώνονται. Γράψε τον κωδικό σου για να συνεχίσεις.
                </p>
                <input value={pin} type="password" inputMode="numeric"
                  onChange={(e) => { setPin(e.target.value.replace(/\D/g, "").slice(0, 4)); setDelErr(""); }}
                  placeholder="Κωδικός (4 ψηφία)"
                  className="f-mono mt-3 h-12 w-full bg-neutral-100 px-3 text-[15px] tracking-[0.3em] outline-none" />
                {delErr && <div className="f-text mt-2 text-[13px] text-neutral-500">{delErr}</div>}
                <Button size="lg" variant="danger" className="mt-3" disabled={deleting} onClick={remove}>
                  {deleting ? "Διαγραφή…" : "Διαγραφή οριστικά"}
                </Button>
                <Button variant="ghost" className="mt-2 w-full" disabled={deleting}
                  onClick={() => { setConfirming(false); setPin(""); setDelErr(""); }}>
                  Άκυρο
                </Button>
              </>
            )}
          </div>
        </>
      )}

      {policy && <PrivacyPolicy onClose={() => setPolicy(false)} />}
    </div>
  );
}

/* Τι θέλει να πετύχει ο πελάτης. Πολλαπλή επιλογή, συν ένα
   ελεύθερο πεδίο για ό,τι δεν χωράει στη λίστα. Τα ίδια τα
   βλέπει η διαχείριση στην ενότητα «Στόχοι πελατών». */
function GoalsPanel({ session, flash }) {
  const [picked, setPicked] = useState([]);
  const [other, setOther] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      const { data, error } = await sb.rpc("my_goals", { p_client_id: session.clientId });
      if (!alive) return;
      if (!error && data) {
        setPicked(Array.isArray(data.goals) ? data.goals : []);
        setOther(data.other || "");
      }
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, [session.clientId]);

  const toggle = (key) => {
    setDirty(true);
    setPicked((prev) => (prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]));
  };

  const save = async () => {
    setSaving(true);
    const { data, error } = await sb.rpc("save_goals", {
      p_client_id: session.clientId,
      p_goals: picked,
      p_other: other.trim() || null,
    });
    setSaving(false);
    if (error || !data || data.ok !== true) { flash("Δεν αποθηκεύτηκε"); return; }
    setDirty(false);
    flash("Οι προτιμήσεις σου αποθηκεύτηκαν");
  };

  return (
    <div className="mt-8 rounded-3xl border border-neutral-200 p-5">
      <div className="f-display text-[14px] font-semibold">Οι προτιμήσεις μου</div>
      <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
        Διάλεξε όσα σου ταιριάζουν. Βοηθάει τον μπαρμπέρη να ξέρει τι θέλεις.
      </p>

      {!loaded ? (
        <div className="f-text py-6 text-[13px] text-neutral-400">Φόρτωση…</div>
      ) : (
        <>
          {GOAL_GROUPS.map(([title, items]) => (
            <div key={title} className="mt-5">
              <div className="f-display text-[11px] font-medium text-neutral-400">{title}</div>
              <div className="mt-2 space-y-2">
                {items.map(([key, label]) => (
                  <button key={key} onClick={() => toggle(key)}
                    className="flex w-full items-start gap-3 text-left">
                    <span className={`mt-[1px] flex h-5 w-5 shrink-0 items-center justify-center rounded-[7px] border border-neutral-300 ${
                      picked.includes(key) ? "bg-black" : "bg-white"}`}>
                      {picked.includes(key) && (
                        <span className="f-display text-[13px] font-bold leading-none text-white">✓</span>
                      )}
                    </span>
                    <span className="f-text text-[14px] leading-snug">{label}</span>
                  </button>
                ))}
              </div>
            </div>
          ))}

          <div className="mt-6">
            <div className="f-display text-[11px] font-medium text-neutral-400">
              Ο δικός σου στόχος
            </div>
            <input value={other} maxLength={120}
              onChange={(e) => { setOther(e.target.value); setDirty(true); }}
              placeholder="Γράψε τον εδώ"
              className="f-text mt-2 h-12 w-full bg-neutral-100 px-3 text-[14px] outline-none" />
          </div>

          <div className="mt-5">
            <Button size="lg" disabled={saving || !dirty} onClick={save}>
              {saving ? "Αποθήκευση…" : dirty ? "Αποθήκευση στόχων" : "Αποθηκευμένο"}
            </Button>
          </div>
        </>
      )}
    </div>
  );
}



function ClientApp({ session, onLogout, onAccountGone, justSignedUp, clearSignedUp, flash, theme, setTheme }) {
  const [tab, setTab] = useState("book");
  const [askPush, setAskPush] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [cancelled, setCancelled] = useState([]);
  const [hidden, setHidden] = useState(readHidden);

  /* Ό,τι έσβησε ο πελάτης μένει σβηστό. Κρατάμε μόνο τα id που
     στέλνει ακόμα ο διακομιστής, για να μη φουσκώνει η λίστα. */
  const hideNotif = (id) => {
    setHidden((prev) => {
      const next = prev.includes(id) ? prev : [...prev, id];
      writeHidden(next);
      return next;
    });
  };
  const clearNotifs = () => {
    const next = notifs.map((n) => n.id);
    writeHidden(next);
    setHidden(next);
  };
  const visibleNotifs = notifs.filter((n) => !hidden.includes(n.id));

  /* Όποιο κομμάτι της εφαρμογής κι αν εντοπίσει την ακύρωση, η
     μπάρα ανεβαίνει από εδώ. */
  useEffect(() => {
    cancelListener = (gone) => setCancelled((prev) => [...gone, ...prev]);
    if (PENDING.length) { setCancelled((prev) => [...PENDING.splice(0), ...prev]); }
    return () => { cancelListener = null; };
  }, []);

  const refresh = useCallback(async () => {
    /* Πρώτα: υπάρχει ακόμα ο λογαριασμός; Αν τον έσβησε η διαχείριση,
       βγαίνει έξω αμέσως και δεν φορτώνουμε τίποτα άλλο. */
    const who = await sb.rpc("client_status", { p_client_id: session.clientId });
    if (!who.error && who.data && who.data.exists === false) { onAccountGone(); return; }

    const [n, mine] = await Promise.all([
      sb.rpc("my_notifications", { p_client_id: session.clientId }),
      sb.rpc("my_bookings", { p_client_id: session.clientId }),
    ]);
    if (!n.error && n.data) { setNotifs(n.data); reportNotifications(n.data); }
    if (!mine.error && mine.data) reportBookings(mine.data.bookings || []);
  }, [session.clientId, onAccountGone]);

  /* Έλεγχος με το άνοιγμα, σε κάθε αλλαγή καρτέλας, κάθε μισό
     λεπτό, και κάθε φορά που ο πελάτης επιστρέφει στην εφαρμογή. */
  useEffect(() => { refresh(); }, [refresh, tab]);

  useEffect(() => {
    const id = setInterval(refresh, 30000);
    const onVisible = () => { if (document.visibilityState === "visible") refresh(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", refresh);
    return () => {
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", refresh);
    };
  }, [refresh]);

  /* Το ποπ απ των ειδοποιήσεων. Βγαίνει μόλις μετά την εγγραφή, και
     μία μόνο φορά ανά συσκευή — αν η συσκευή είναι ήδη γραμμένη ή αν
     έχει ήδη απαντήσει, δεν εμφανίζεται καθόλου. */
  useEffect(() => {
    let alive = true;
    (async () => {
      if (pushAsked()) return;
      if (!pushSupported() && !(isIOS() && !isStandalone())) return;
      if (await hasPushSubscription()) { markPushAsked(); return; }
      if (!alive) return;
      /* Μικρή καθυστέρηση μετά την εγγραφή, για να προλάβει να δει
         πρώτα ότι μπήκε. */
      setTimeout(() => { if (alive) setAskPush(true); }, justSignedUp ? 900 : 2500);
    })();
    return () => { alive = false; };
  }, [justSignedUp]);

  useEffect(() => {
    if (notifs.length === 0) return;
    const live = new Set(notifs.map((x) => x.id));
    setHidden((prev) => {
      const next = prev.filter((id) => live.has(id));
      if (next.length === prev.length) return prev;
      writeHidden(next);
      return next;
    });
  }, [notifs]);

  /* Τα αρχικά του πελάτη κάνουν το κουμπί των ρυθμίσεων να μοιάζει
     με προφίλ — και κρατάει το όνομά του στην οθόνη. */
  const initials = (
    (session.firstName || "").trim().charAt(0) + (session.lastName || "").trim().charAt(0)
  ).toUpperCase() || "•";

  const tabs = [
    { k: "book", label: "Πρόγραμμα", icon: <CalendarIcon size={21} /> },
    { k: "mine", label: "Ραντεβού", icon: <TicketIcon size={21} /> },
  ];

  return (
    <div className="mx-auto flex h-full max-w-md flex-col overflow-hidden">
      <Hero tall tagline={TAGLINE} right={
        <button onClick={() => setSettingsOpen(!settingsOpen)}
          aria-label={settingsOpen ? "Κλείσιμο ρυθμίσεων" : "Ρυθμίσεις"}
          className="on-hero flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/25 bg-white/10 backdrop-blur-sm active:opacity-70">
          {settingsOpen
            ? <span className="text-[22px] leading-none">×</span>
            : <span className="f-display text-[14px] font-semibold">{initials}</span>}
        </button>
      } />

      <div className="sheet relative z-10 -mt-7 flex min-h-0 flex-1 flex-col overflow-hidden">

      {cancelled.length > 0 && !notifs.some((n) => n.kind === "cancelled") && (
        <div className="mx-5 mt-5 shrink-0 space-y-2">
          {cancelled.map((c) => (
            <div key={c.id} className="flex items-start justify-between gap-3 rounded-2xl bg-black px-4 py-3 text-white">
              <div className="min-w-0">
                <div className="f-display text-[14px] font-semibold leading-tight">
                  Το ραντεβού σου ακυρώθηκε
                </div>
                <div className="f-text mt-1 text-[12px] opacity-60">{fmtDayLong(c.date)}, {c.time}</div>
              </div>
              <button aria-label="Κλείσιμο"
                onClick={() => setCancelled((prev) => prev.filter((x) => x.id !== c.id))}
                className="shrink-0 text-[20px] leading-none opacity-60">×</button>
            </div>
          ))}
        </div>
      )}

      {visibleNotifs.length > 0 && !settingsOpen && (
        <div className="mx-5 mt-5 shrink-0 space-y-2">
          {visibleNotifs.map((n) => (
            <div key={n.id} className="flex items-start justify-between gap-3 rounded-2xl bg-neutral-100 px-4 py-3">
              <div className="f-text min-w-0 text-[13px] leading-snug text-neutral-700">{n.body}</div>
              <button aria-label="Διαγραφή" onClick={() => hideNotif(n.id)}
                className="shrink-0 text-[19px] leading-none text-neutral-400">×</button>
            </div>
          ))}
          {visibleNotifs.length > 1 && (
            <button onClick={clearNotifs}
              className="f-display w-full text-[12px] font-medium text-neutral-500">
              Διαγραφή όλων
            </button>
          )}
        </div>
      )}

      <main className="min-h-0 flex-1">
        {settingsOpen ? (
          <SettingsTab session={session} flash={flash} theme={theme} setTheme={setTheme}
            onLogout={onLogout} onAccountDeleted={() => onAccountGone("self")} />
        ) : (
          <React.Fragment>
            {tab === "book" && <BookTab session={session} flash={flash} onGoMine={() => setTab("mine")} />}
            {tab === "mine" && <MyBookings session={session} flash={flash} />}
          </React.Fragment>
        )}
      </main>

      <nav className="shrink-0 px-4 pt-2" style={ {
        paddingBottom: "max(10px, env(safe-area-inset-bottom))",
        borderTop: "1px solid var(--line)",
      } }>
        <div className="flex">
          {tabs.map(({ k, label, icon }) => {
            const on = tab === k && !settingsOpen;
            return (
              <button key={k} onClick={() => { setTab(k); setSettingsOpen(false); }}
                className={`flex flex-1 flex-col items-center gap-1 rounded-2xl py-1.5 ${
                  on ? "text-black" : "text-neutral-400"}`}>
                {icon}
                <span className="f-display text-[11px] font-medium">{label}</span>
                <span className={`h-[2px] w-6 rounded-full ${on ? "bg-black" : "bg-transparent"}`} />
              </button>
            );
          })}
        </div>
      </nav>

      </div>

      {askPush && (
        <PushPrompt session={session} flash={flash}
          onClose={() => { setAskPush(false); if (clearSignedUp) clearSignedUp(); }} />
      )}

    </div>
  );
}

function BookTab({ session, flash, onGoMine }) {
  const [date, setDate] = useState(iso(new Date()));
  const [services, setServices] = useState(null);
  const [svcId, setSvcId] = useState(null);
  const [slots, setSlots] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busySlot, setBusySlot] = useState(null);
  const [mine, setMine] = useState({});
  const [myWaits, setMyWaits] = useState({});
  /* Το επόμενο ραντεβού, για τη μπάρα στο τέλος της οθόνης. */
  const [next, setNext] = useState(null);
  /* Πρώτο πάτημα σε δικό του ραντεβού: ρωτάει. Δεύτερο: ακυρώνει. */
  const [armed, setArmed] = useState(null);

  useEffect(() => {
    if (!armed) return;
    const id = setTimeout(() => setArmed(null), 4000);
    return () => clearTimeout(id);
  }, [armed]);

  const days = useMemo(() => {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    return Array.from({ length: MAX_DAYS_AHEAD + 1 }, (_, i) => iso(addDays(base, i)));
  }, []);

  /* Οι υπηρεσίες φορτώνουν μία φορά. Η πρώτη διαλέγεται μόνη της,
     ώστε ο πελάτης να βλέπει αμέσως ώρες και να μη μένει σε άδεια
     οθόνη περιμένοντας να πατήσει κάτι. */
  useEffect(() => {
    let alive = true;
    (async () => {
      const { data, error } = await sb.rpc("public_services", {});
      if (!alive) return;
      const list = !error && Array.isArray(data) ? data : [];
      setServices(list);
      if (list.length) setSvcId(list[0].id);
      else setLoading(false);
    })();
    return () => { alive = false; };
  }, []);

  const svc = (services || []).find((s) => s.id === svcId) || null;

  const load = useCallback(async () => {
    if (!svcId) return;
    setLoading(true);
    const [avail, mineRes] = await Promise.all([
      sb.rpc("day_availability", { p_date: date, p_service_id: svcId }),
      sb.rpc("my_bookings", { p_client_id: session.clientId }),
    ]);
    setLoading(false);
    if (!mineRes.error && mineRes.data) reportBookings(mineRes.data.bookings || []);
    if (avail.error) { flash("Δεν φορτώθηκε το πρόγραμμα"); return; }
    setSlots(avail.data || []);

    // Ποιες ώρες αυτής της ημέρας έχει ήδη κλείσει ο πελάτης.
    const map = {};
    const list = (mineRes.data && mineRes.data.bookings) || [];
    for (const b of list) if (b.date === date) map[b.time] = b;
    setMine(map);

    const waits = {};
    const wl = (mineRes.data && mineRes.data.waitlist) || [];
    for (const w of wl) if (w.date === date) waits[w.time] = true;
    setMyWaits(waits);

    /* Το πιο κοντινό ραντεβού που δεν έχει περάσει. */
    const now = new Date();
    const upcoming = list
      .filter((b) => b.status === "booked" && slotDate(b.date, b.time) >= now)
      .sort((a, b) => slotDate(a.date, a.time) - slotDate(b.date, b.time));
    setNext(upcoming[0] || null);
  }, [date, svcId, flash, session.clientId]);

  useEffect(() => { load(); }, [load]);

  const book = async (time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("create_booking", {
      p_client_id: session.clientId, p_date: date, p_time: time, p_service_id: svcId,
    });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    /* Στο μήνυμα μπαίνει και η ώρα που τελειώνει, ώστε να ξέρει πόσο
       θα μείνει και όχι μόνο πότε θα έρθει. */
    flash(`Ραντεβού ${fmtDay(date)}, ${time}${svc ? `–${endOf(time, svc.duration_min)}` : ""}`);
    load();
  };

  const cancel = async (bookingId, time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("cancel_booking", {
      p_client_id: session.clientId, p_booking_id: bookingId,
    });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    forgetBooking(bookingId);
    setArmed(null);
    flash("Το ραντεβού ακυρώθηκε");
    load();
  };

  const waitlist = async (time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("join_waitlist", {
      p_client_id: session.clientId, p_date: date, p_time: time, p_service_id: svcId,
    });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    flash("Μπήκες στη λίστα αναμονής");
  };

  /* Πόσο κρατάει το ραντεβού, σε λόγια. Η βάση δουλεύει με λεπτά. */
  const dur = (m) => (m >= 60 && m % 60 === 0 ? `${m / 60}ω` : m >= 60 ? `${Math.floor(m / 60)}ω ${m % 60}′` : `${m}′`);

  /* Πού τελειώνει ένα ραντεβού που ξεκινάει εδώ. Το δείχνουμε ώστε
     να ξέρει ο πελάτης πόσο θα μείνει, όχι μόνο πότε θα έρθει. */
  const endOf = (time, minutes) => {
    const [h, m] = time.split(":").map(Number);
    const t = h * 60 + m + minutes;
    return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
  };

  /* Ένα πάτημα, μία ενέργεια: ελεύθερη ώρα κλείνει, πιασμένη βάζει
     σε αναμονή, δική του ρωτάει πρώτα και μετά ακυρώνει. */
  const tapSlot = (s) => {
    const booked = mine[s.slot_time];
    if (booked) {
      if (armed === s.slot_time) { setArmed(null); cancel(booked.id, s.slot_time); }
      else setArmed(s.slot_time);
      return;
    }
    setArmed(null);
    if (s.free) book(s.slot_time);
    else if (!myWaits[s.slot_time]) waitlist(s.slot_time);
  };

  return (
    <div className="h-full overflow-y-auto px-5">
      <div className="flex items-start gap-3 pt-6">
        <span className="mt-[2px] shrink-0"><CalendarIcon size={22} /></span>
        <div className="min-w-0">
          <h2 className="f-display text-[20px] font-semibold leading-tight">Κλείσε ραντεβού</h2>
          <p className="f-text mt-1 text-[13px] text-neutral-500">
            Διάλεξε μέρα και ώρα που σε εξυπηρετεί.
          </p>
        </div>
      </div>

      {/* Υπηρεσία πρώτα: αλλάζει ποιες ώρες χωράνε. */}
      {(services || []).length > 0 && (
        <div className="-mx-5 mt-5 flex gap-2 overflow-x-auto px-5 pb-1">
          {(services || []).map((s) => {
            const on = s.id === svcId;
            return (
              <button key={s.id} onClick={() => { setSvcId(s.id); setArmed(null); }}
                className={`flex h-10 shrink-0 items-center gap-2 rounded-full px-4 active:opacity-70 ${
                  on ? "bg-black text-white" : "bg-neutral-100 text-neutral-600"}`}>
                <span className="f-display text-[13px] font-medium">{s.name}</span>
                <span className="f-mono text-[11px] opacity-60">
                  {dur(s.duration_min)}{s.price ? ` ${Number(s.price).toFixed(2)}€` : ""}
                </span>
              </button>
            );
          })}
        </div>
      )}

      <div className="-mx-5 mt-3 flex gap-2 overflow-x-auto px-5 pb-1">
        {days.map((d) => {
          const dd = parseISO(d), on = d === date;
          return (
            <button key={d} onClick={() => { setDate(d); setArmed(null); }}
              className={`flex h-[84px] w-[60px] shrink-0 flex-col items-center justify-center gap-1 rounded-[20px] active:opacity-70 ${
                on ? "bg-black text-white" : "bg-neutral-100 text-neutral-600"}`}>
              <span className="f-text text-[11px] opacity-70">{DAYS[dd.getDay()]}</span>
              <span className="f-mono text-[20px] font-medium leading-none">{dd.getDate()}</span>
              <span className="f-text text-[11px] opacity-60">{MONTHS[dd.getMonth()]}</span>
            </button>
          );
        })}
      </div>

      <div className="mt-7 flex items-baseline gap-2">
        <span className="mt-[3px] self-start text-neutral-500"><ClockIcon size={17} /></span>
        <h3 className="f-display text-[15px] font-semibold">Διαθέσιμες ώρες</h3>
        <span className="f-text ml-auto text-[12px] text-neutral-400">{fmtDayLong(date)}</span>
      </div>

      {services !== null && services.length === 0 ? (
        <div className="mt-4 rounded-3xl bg-neutral-100 px-6 py-12 text-center">
          <div className="f-display text-[17px] font-semibold">Καμία υπηρεσία ακόμα</div>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-500">
            Το κατάστημα δεν έχει καταχωρίσει υπηρεσίες. Δοκίμασε πάλι σε λίγο.
          </p>
        </div>
      ) : loading ? (
        <div className="mt-3 grid grid-cols-4 gap-2">
          {Array.from({ length: 8 }).map((_, i) => (
            <div key={i} className="h-[52px] animate-pulse rounded-2xl bg-neutral-100" />
          ))}
        </div>
      ) : (slots || []).length === 0 ? (
        <div className="mt-4 rounded-3xl bg-neutral-100 px-6 py-12 text-center">
          <div className="f-display text-[17px] font-semibold">Κλειστά</div>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-500">
            {date === iso(new Date())
              ? "Οι ώρες για σήμερα πέρασαν. Δες την επόμενη μέρα."
              : "Δεν υπάρχουν ώρες αυτή τη μέρα."}
          </p>
        </div>
      ) : (
        <React.Fragment>
          <div className="mt-3 grid grid-cols-4 gap-2">
            {(slots || []).map((s) => {
              /* Το "free" το κρίνει η βάση: χωράει ολόκληρη η υπηρεσία
                 ξεκινώντας εδώ; Ένα ραντεβού 60′ θέλει δύο μισάωρα
                 ελεύθερα, οπότε δεν αρκεί να είναι ελεύθερη η ώρα. */
              const booked = mine[s.slot_time];
              const isBusy = busySlot === s.slot_time;
              const armedHere = armed === s.slot_time;
              const wait = myWaits[s.slot_time];
              const skin = booked
                ? "bg-black text-white"
                : s.free ? "bg-neutral-100 text-black" : "bg-neutral-100 text-neutral-400";
              return (
                <button key={s.slot_time} disabled={isBusy} onClick={() => tapSlot(s)}
                  aria-label={`${s.slot_time}${booked ? ", δικό σου ραντεβού" : s.free ? ", ελεύθερη" : ", πιασμένη"}`}
                  className={`flex h-[52px] flex-col items-center justify-center rounded-2xl px-1 ${skin} ${
                    isBusy ? "opacity-50" : "active:opacity-70"}`}>
                  {armedHere ? (
                    <span className="f-display text-[12px] font-semibold leading-none">Ακύρωση;</span>
                  ) : (
                    <React.Fragment>
                      <span className={`f-mono text-[15px] leading-none ${
                        !booked && !s.free ? "line-through decoration-[1.5px]" : ""}`}>
                        {s.slot_time}
                      </span>
                      {booked ? (
                        <span className="f-text mt-1 text-[10px] leading-none opacity-60">δικό σου</span>
                      ) : wait ? (
                        <span className="f-text mt-1 text-[10px] leading-none">αναμονή</span>
                      ) : s.capacity > 1 ? (
                        <span className="f-mono mt-1 text-[10px] leading-none opacity-60">{s.taken}/{s.capacity}</span>
                      ) : null}
                    </React.Fragment>
                  )}
                </button>
              );
            })}
          </div>
          <p className="f-text mt-3 text-[12px] leading-relaxed text-neutral-400">
            Πάτα μια ώρα για να την κλείσεις. Στις πιασμένες μπαίνεις σε λίστα
            αναμονής, και στη δική σου πάτα δύο φορές για ακύρωση.
          </p>
        </React.Fragment>
      )}

      {next && (
        <button onClick={onGoMine}
          className="mt-6 flex w-full items-center justify-between gap-3 rounded-full bg-black px-5 py-3.5 text-white active:opacity-70">
          <span className="f-text text-[12px] opacity-60">Επόμενο ραντεβού</span>
          <span className="f-display text-[14px] font-medium">{fmtDay(next.date)} στις {next.time}</span>
        </button>
      )}

      <div className="h-8" />
    </div>
  );
}
function MyBookings({ session, flash }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busyId, setBusyId] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    const { data: d, error } = await sb.rpc("my_bookings", { p_client_id: session.clientId });
    setLoading(false);
    if (error) { flash("Δεν φορτώθηκαν τα ραντεβού"); return; }
    setData(d);
    reportBookings((d && d.bookings) || []);
  }, [session.clientId, flash]);

  useEffect(() => { load(); }, [load]);

  const cancel = async (bookingId) => {
    setBusyId(bookingId);
    const { data: d, error } = await sb.rpc("cancel_booking", { p_client_id: session.clientId, p_booking_id: bookingId });
    setBusyId(null);
    if (error || !d?.ok) { flash(d?.error || "Κάτι πήγε στραβά"); return; }
    forgetBooking(bookingId);
    flash("Το ραντεβού ακυρώθηκε");
    load();
  };

  const label = { booked: "Κλεισμένο" };
  const bookings = data?.bookings || [];
  const waits = data?.waitlist || [];

  return (
    <div className="h-full overflow-y-auto px-5">
      <h2 className="f-display pt-6 text-[20px] font-semibold">Τα ραντεβού μου</h2>

      {loading ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : bookings.length === 0 && waits.length === 0 ? (
        <Empty title="Δεν έχεις ενεργό ραντεβού." />
      ) : (
        <div className="mt-5 space-y-2">
          {bookings.map((b) => (
            <div key={b.id} className="flex items-center justify-between gap-3 rounded-2xl bg-neutral-100 px-4 py-3.5">
              <div className="min-w-0">
                <span className="f-mono block text-[19px] font-medium leading-none">{b.time}</span>
                <div className="f-text mt-1.5 text-[12px] text-neutral-500">
                  {fmtDay(b.date)}, {b.service_name || label[b.status] || b.status}
                </div>
              </div>
              {b.status === "booked" && (
                <Button variant="outline" size="sm" disabled={busyId === b.id} onClick={() => cancel(b.id)}>Ακύρωση</Button>
              )}
            </div>
          ))}
          {waits.map((w) => (
            <div key={w.id} className="flex items-center justify-between gap-3 rounded-2xl bg-neutral-100 px-4 py-3.5">
              <div className="min-w-0">
                <span className="f-mono block text-[19px] font-medium leading-none text-neutral-400">{w.time}</span>
                <div className="f-text mt-1.5 text-[12px] text-neutral-500">{fmtDay(w.date)}, λίστα αναμονής</div>
              </div>
              <span className="f-text shrink-0 text-[12px] text-neutral-400">Σε αναμονή</span>
            </div>
          ))}
        </div>
      )}

      <div className="h-10" />
    </div>
  );
}

/* Εγγραφή αυτής της συσκευής στις push ειδοποιήσεις. */
function PushPanel({ session, flash }) {
  const [mode, setMode] = useState("checking"); // checking | unsupported | needs-install | off | on
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    (async () => {
      if (isIOS() && !isStandalone()) { setMode("needs-install"); return; }
      if (!pushSupported()) { setMode("unsupported"); return; }
      try {
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();

        /* Αν η εγγραφή έγινε με άλλο κλειδί VAPID, είναι άχρηστη —
           ο διακομιστής δεν μπορεί να της στείλει τίποτα. Τη σβήνουμε
           ώστε να ξαναγίνει σωστά. */
        if (sub && !matchesVapid(sub)) {
          try { await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint }); } catch (e) { /* ignore */ }
          try { await sub.unsubscribe(); } catch (e) { /* ignore */ }
          sub = null;
        }

        /* Η συνδρομή ζει στη συσκευή, αλλά η γραμμή της στη βάση
           μπορεί να έχει σβηστεί — π.χ. όταν ένα παλιό push γύρισε
           404. Τότε το κινητό νομίζει ότι είναι γραμμένο, δείχνει τον
           διακόπτη ανοιχτό, και δεν ξαναγράφεται ποτέ. Την ξαναγράφουμε
           σε κάθε άνοιγμα· η βάση κάνει upsert, δεν διπλογράφεται. */
        if (sub) {
          const json = sub.toJSON();
          sb.rpc("save_push_subscription", {
            p_client_id: session.clientId,
            p_endpoint: sub.endpoint,
            p_p256dh: json.keys.p256dh,
            p_auth: json.keys.auth,
          });
        }

        setMode(sub ? "on" : "off");
      } catch (e) {
        setMode("off");
      }
    })();
  }, [session.clientId]);

  const enable = async () => {
    setBusy(true);
    const r = await subscribePush(session.clientId);
    setBusy(false);
    markPushAsked();
    if (!r.ok) {
      flash(r.error === "denied" ? "Δεν δόθηκε άδεια"
        : r.error === "save" ? "Δεν αποθηκεύτηκε" : "Κάτι πήγε στραβά");
      return;
    }
    setMode("on");
    flash("Οι ειδοποιήσεις ενεργοποιήθηκαν");
  };

  const disable = async () => {
    setBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint });
        await sub.unsubscribe();
      }
      setMode("off");
      flash("Οι ειδοποιήσεις απενεργοποιήθηκαν");
    } catch (e) {
      flash("Κάτι πήγε στραβά");
    }
    setBusy(false);
  };

  const test = async () => {
    setBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(SHOP_NAME, {
        body: "Δοκιμαστική ειδοποίηση. Αν τη βλέπεις, όλα δουλεύουν.",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: "barber-test",
      });
    } catch (e) {
      flash("Δεν εμφανίστηκε");
    }
    setBusy(false);
  };

  if (mode === "checking" || mode === "unsupported") return null;

  return (
    <div className="mt-8 rounded-3xl border border-neutral-200 p-5">
      <div className="f-display text-[14px] font-semibold">Ειδοποιήσεις</div>

      {mode === "needs-install" && (
        <>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
            Στο iPhone οι ειδοποιήσεις δουλεύουν μόνο αν προσθέσεις πρώτα την εφαρμογή
            στην αρχική οθόνη και την ανοίξεις από εκεί:
          </p>
          <ol className="f-text mt-2 space-y-1 text-[13px] leading-relaxed text-neutral-600">
            <li>1. Πάτα το κουμπί κοινοποίησης του Safari (τετράγωνο με βέλος).</li>
            <li>2. Διάλεξε «Προσθήκη στην οθόνη Home».</li>
            <li>3. Άνοιξε την εφαρμογή από το νέο εικονίδιο.</li>
          </ol>
        </>
      )}

      {mode === "off" && (
        <>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
            Ενημέρωση όταν ελευθερώνεται θέση από τη λίστα αναμονής, όταν ακυρώνεται
            ραντεβού σου, και υπενθύμιση πριν το ραντεβού.
          </p>
          <Button className="mt-4 w-full" disabled={busy} onClick={enable}>
            {busy ? "…" : "Ενεργοποίηση ειδοποιήσεων"}
          </Button>
        </>
      )}

      {mode === "on" && (
        <>
          <p className="f-text mt-2 text-[13px] text-neutral-600">
            Ενεργές σε αυτή τη συσκευή.
          </p>
          <Button variant="outline" className="mt-4 w-full" disabled={busy} onClick={test}>
            Δοκιμαστική ειδοποίηση
          </Button>
          <Button variant="ghost" className="mt-2 w-full" disabled={busy} onClick={disable}>
            {busy ? "…" : "Απενεργοποίηση"}
          </Button>
        </>
      )}
    </div>
  );
}

/* Πιάνει σφάλματα που συμβαίνουν κατά τη σχεδίαση των components,
   τα οποία δεν φαίνονται αλλιώς (εμφανίζονται ως "Script error"). */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { err: null, info: null };
  }
  static getDerivedStateFromError(err) {
    return { err: err };
  }
  componentDidCatch(err, info) {
    this.setState({ err: err, info: info });
  }
  render() {
    if (this.state.err) {
      return (
        <div className="mx-auto flex min-h-full max-w-md flex-col items-center justify-center px-6 text-center">
          <StatusStrip />
          <div className="f-display text-[26px] font-semibold leading-tight">
            Κάτι πήγε στραβά
          </div>
          <p className="f-text mt-3 text-[14px] leading-relaxed text-neutral-500">
            Δοκίμασε να ανανεώσεις τη σελίδα. Αν συνεχίσει, ενημέρωσε το κατάστημα.
          </p>
          <Button className="mt-6" onClick={() => window.location.reload()}>Ανανέωση</Button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* Καταχώρηση του service worker — απαραίτητο για τα push. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* αγνόησε */ });
  });
}

/* ---------- Ρυθμίσεις πριν το πρώτο render ----------
   Το όνομα του γυμναστηρίου φαίνεται στην πρώτη κιόλας οθόνη, οπότε
   το περιμένουμε. Αν ο διακομιστής αργήσει πάνω από 3 δευτερόλεπτα,
   ξεκινάμε με τις εφεδρικές τιμές αντί να μείνει η σελίδα κολλημένη
   στο «Φόρτωση…». */
async function loadAppSettings() {
  const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 3000));
  const call = sb.rpc("app_settings", {}).then((r) => (r.error ? null : r.data)).catch(() => null);
  const data = await Promise.race([call, timeout]);
  if (!data) return;
  if (data.shop_name) SHOP_NAME = data.shop_name;
  if (data.max_days_ahead) MAX_DAYS_AHEAD = data.max_days_ahead;
}

/* Το όνομα μπαίνει και στην καρτέλα του browser και στην ετικέτα που
   προτείνει το iPhone στο «Πρόσθεση στην αρχική οθόνη». */
function applyBrandToPage() {
  document.title = SHOP_NAME;
  const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (meta) meta.setAttribute("content", SHOP_NAME);
  applyBrandToManifest();
  tellServiceWorker();
}

/* Οι push ειδοποιήσεις τις δείχνει ο service worker, που δεν βλέπει
   τις ρυθμίσεις. Του περνάμε το όνομα σε κάθε άνοιγμα. */
function tellServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready
    .then((reg) => { if (reg.active) reg.active.postMessage({ type: "brand", name: SHOP_NAME }); })
    .catch(() => { /* αγνόησε */ });
}

/* Το manifest.json είναι στατικό αρχείο, οπότε το ξαναγράφουμε στη
   μνήμη με το σωστό όνομα και το δίνουμε ως blob. Οι διαδρομές των
   εικονιδίων γίνονται απόλυτες, αλλιώς το blob δεν ξέρει πού να τις
   ψάξει. Αν κάτι πάει στραβά, μένει το αρχικό link — χάνεται μόνο το
   όνομα, όχι η εγκατάσταση. */
async function applyBrandToManifest() {
  try {
    const link = document.querySelector('link[rel="manifest"]');
    if (!link) return;
    const res = await fetch(link.href);
    if (!res.ok) return;
    const m = await res.json();
    m.name = SHOP_NAME;
    m.short_name = SHOP_NAME;
    const abs = (u) => new URL(u, link.href).href;
    if (m.start_url) m.start_url = abs(m.start_url);
    if (m.scope) m.scope = abs(m.scope);
    for (const i of m.icons || []) i.src = abs(i.src);
    for (const sc of m.shortcuts || []) {
      if (sc.url) sc.url = abs(sc.url);
      for (const i of sc.icons || []) i.src = abs(i.src);
    }
    const blob = new Blob([JSON.stringify(m)], { type: "application/manifest+json" });
    link.href = URL.createObjectURL(blob);
  } catch (e) { /* μένει το στατικό manifest */ }
}

loadAppSettings().then(() => {
  applyBrandToPage();
  ReactDOM.createRoot(document.getElementById("root")).render(
    <ErrorBoundary><App /></ErrorBoundary>
  );
});
